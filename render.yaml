services:
  - type: web
    name: interviewflow-ai-mrinal-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: VOICE_TRANSPORT
        value: daily
      - key: INTERVIEW_DURATION_MINUTES
        value: 15
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_EVALUATOR_MODEL
        value: openai/gpt-oss-120b
      - key: DEEPGRAM_STT_MODEL
        value: nova-3-general
      - key: DEEPGRAM_TTS_VOICE
        value: aura-2-helena-en
      - key: PIPECAT_ALLOWED_ORIGINS
        value: https://interviewflow-ai-mrinal.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DAILY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: interviewflow-ai-mrinal
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: ./client/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://interviewflow-ai-mrinal-api.onrender.com
      - key: VITE_VOICE_TRANSPORT
        value: daily
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
